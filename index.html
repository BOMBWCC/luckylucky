<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>刮刮乐 Battle</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --red: #e71912;
      --deep-red: #a90705;
      --gold: #ffd54f;
      --paper: #f3eee4;
      --ink: #342f2d;
      --muted: #6d5c57;
      --panel: rgba(255, 235, 144, .14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 16% 8%, rgba(255, 223, 83, .26), transparent 24%),
        radial-gradient(circle at 86% 14%, rgba(76, 183, 255, .2), transparent 26%),
        linear-gradient(150deg, #101f2a, #254e55 48%, #121b22);
    }

    button {
      font: inherit;
    }

    .app {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 10px 10px 14px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .topbar {
      min-height: 54px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      color: white;
    }

    .title {
      min-width: 0;
    }

    .title strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
      color: var(--gold);
    }

    .title span {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.25;
      opacity: .88;
    }

    .timer {
      display: grid;
      place-items: center;
      width: 58px;
      height: 42px;
      border: 2px solid rgba(255, 213, 79, .9);
      border-radius: 8px;
      color: #fff6c0;
      font-size: 23px;
      font-weight: 950;
      background: rgba(100, 0, 0, .26);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .primary-button,
    .ghost-button {
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary-button {
      color: #731109;
      background: linear-gradient(180deg, #fff4b5, #ffc638);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .72);
    }

    .ghost-button {
      color: #fff1af;
      border: 1px solid rgba(255, 213, 79, .62);
      background: rgba(255, 255, 255, .08);
    }

    .primary-button:disabled,
    .ghost-button:disabled {
      cursor: not-allowed;
      opacity: .52;
    }

    .webrtc-panel {
      padding: 9px;
      border: 1px solid rgba(255, 213, 79, .48);
      border-radius: 8px;
      color: white;
      background: rgba(0, 0, 0, .18);
    }

    .webrtc-panel summary {
      cursor: pointer;
      color: #ffe486;
      font-size: 13px;
      font-weight: 900;
    }

    .webrtc-body {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }

    .webrtc-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .webrtc-status {
      min-height: 18px;
      color: rgba(255, 255, 255, .82);
      font-size: 12px;
      line-height: 1.35;
    }

    .signal-box {
      width: 100%;
      min-height: 62px;
      resize: vertical;
      border: 1px solid rgba(255, 213, 79, .36);
      border-radius: 6px;
      padding: 7px;
      color: #fff6cb;
      font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(0, 0, 0, .28);
    }

    .signal-box::placeholder {
      color: rgba(255, 246, 203, .46);
    }

    .battle-scoreboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      min-height: 0;
    }

    .score-card {
      position: relative;
      overflow: hidden;
      min-height: 76px;
      padding: 8px;
      border: 1px solid rgba(255, 213, 79, .56);
      border-radius: 8px;
      color: white;
      background: rgba(0, 0, 0, .18);
    }

    .score-card.active {
      border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(255, 213, 79, .24);
    }

    .score-card b {
      display: block;
      font-size: 12px;
      color: #ffe486;
    }

    .score {
      margin-top: 4px;
      font-size: 26px;
      line-height: 1;
      font-weight: 950;
    }

    .score-meta {
      margin-top: 5px;
      font-size: 11px;
      opacity: .76;
    }

    .float-zone {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .float-score {
      position: absolute;
      left: 50%;
      bottom: 2px;
      translate: -50% 0;
      color: #ffe86f;
      font-size: 34px;
      font-weight: 950;
      -webkit-text-stroke: 1px #7e0d05;
      text-shadow:
        0 3px 0 #9b1208,
        0 0 12px rgba(255, 226, 67, .9),
        0 10px 22px rgba(0, 0, 0, .45);
      animation: floatScore 1.05s cubic-bezier(.16, .95, .24, 1) forwards;
    }

    @keyframes floatScore {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.55) rotate(-4deg);
      }
      14% {
        opacity: 1;
        transform: translateY(-4px) scale(1.36) rotate(2deg);
      }
      38% {
        opacity: 1;
        transform: translateY(-22px) scale(1.08) rotate(-1deg);
      }
      to {
        opacity: 0;
        transform: translateY(-74px) scale(.96) rotate(0deg);
      }
    }

    .ticket-wrap {
      display: grid;
      justify-items: center;
    }

    .ticket {
      position: relative;
      overflow: hidden;
      width: min(100%, 338px);
      min-height: 485px;
      padding: 11px 12px 13px;
      border: 4px solid #ffce45;
      border-radius: 8px;
      background:
        radial-gradient(circle at 11px 11px, rgba(255, 217, 88, .34) 0 2px, transparent 3px) 0 0 / 26px 26px,
        radial-gradient(circle at 100% 9%, rgba(255, 226, 87, .3), transparent 28%),
        linear-gradient(160deg, #ff2d15, var(--red) 42%, #c90a06);
      box-shadow: 0 18px 42px rgba(45, 10, 0, .32);
    }

    .ticket::before,
    .ticket::after {
      content: "";
      position: absolute;
      inset: 8px;
      pointer-events: none;
      border: 1px solid rgba(255, 213, 79, .9);
      border-radius: 5px;
    }

    .ticket::after {
      inset: 17px;
      border-style: dashed;
      opacity: .5;
    }

    .brand,
    .ticket-main,
    .numbers-panel,
    .ticket-foot {
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      color: #ffe65d;
      text-shadow: 0 3px 0 rgba(121, 0, 0, .48), 0 0 12px rgba(255, 233, 103, .35);
    }

    .brand-kicker {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      font-weight: 900;
      color: #ffd76c;
    }

    .brand h1 {
      margin: -1px 0 0;
      font-size: 43px;
      line-height: .92;
      letter-spacing: 0;
      font-family: "STXingkai", "KaiTi", "Microsoft YaHei", cursive;
    }

    .ticket-main {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      margin-top: 9px;
    }

    .side-panel {
      min-height: 178px;
      display: grid;
      gap: 7px;
      align-content: start;
      padding: 7px 6px;
      border: 2px solid rgba(255, 213, 79, .86);
      color: #ffe57d;
      background: rgba(177, 9, 4, .34);
    }

    .notice {
      padding: 5px;
      border-radius: 5px;
      color: #a80a05;
      font-size: 9px;
      line-height: 1.32;
      font-weight: 900;
      background: #ffd047;
    }

    .prize-callout {
      display: grid;
      place-items: center;
      min-height: 72px;
      border: 1px solid #ffce45;
      font-size: 20px;
      line-height: 1.04;
      font-weight: 950;
      text-align: center;
      background: rgba(255, 60, 10, .42);
    }

    .scratch-panel {
      position: relative;
      overflow: hidden;
      min-height: 178px;
      border: 2px solid rgba(255, 213, 79, .86);
      background: var(--paper);
      box-shadow: inset 0 0 0 1px rgba(130, 0, 0, .18);
      touch-action: none;
      user-select: none;
    }

    .scratch-content {
      min-height: 178px;
      padding: 6px 7px;
      background:
        repeating-linear-gradient(112deg, rgba(171, 37, 103, .12) 0 2px, transparent 2px 8px),
        linear-gradient(#f7f2e9, #e7dfd2);
    }

    .scratch-row {
      display: grid;
      grid-template-columns: 20px 1fr 52px;
      align-items: center;
      min-height: 23px;
      border-bottom: 1px dashed rgba(70, 47, 41, .25);
      font-size: 10px;
    }

    .round {
      color: var(--muted);
      writing-mode: vertical-rl;
      font-weight: 900;
    }

    .symbols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      justify-items: center;
      font-size: 17px;
      filter: grayscale(1);
    }

    .amount {
      justify-self: end;
      color: #2f2b29;
      font-size: 12px;
      font-weight: 950;
    }

    .scratch-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .numbers-panel {
      margin-top: 9px;
      overflow: hidden;
      border: 2px solid rgba(255, 213, 79, .86);
      background: var(--paper);
    }

    .numbers-head {
      display: grid;
      grid-template-columns: 82px 1fr 48px;
      gap: 6px;
      align-items: end;
      padding: 6px 7px 3px;
      color: #97140c;
      font-size: 10px;
      font-weight: 950;
      background: linear-gradient(180deg, rgba(255, 218, 72, .72), rgba(255, 218, 72, .2));
    }

    .winning-number {
      color: #2f2b29;
      font-size: 20px;
      line-height: 1;
      text-align: center;
      text-shadow: 1px 1px 0 white;
    }

    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      padding: 6px 7px 8px;
      background:
        repeating-linear-gradient(110deg, rgba(173, 42, 109, .13) 0 2px, transparent 2px 8px),
        #eee8dd;
    }

    .number-cell {
      min-height: 30px;
      display: grid;
      place-items: center;
      border-bottom: 1px dashed rgba(67, 49, 44, .28);
      color: #342f2d;
      font-size: 17px;
      font-weight: 950;
      text-shadow: 1px 1px 0 #fff;
    }

    .matched {
      color: #b90f08;
      outline: 1px solid rgba(185, 15, 8, .5);
      background: rgba(255, 218, 72, .42);
      border-radius: 3px;
    }

    .ticket-foot {
      display: grid;
      grid-template-columns: 1fr 112px;
      align-items: end;
      gap: 8px;
      margin-top: 9px;
      padding: 6px 7px;
      min-height: 38px;
      border: 2px solid rgba(255, 213, 79, .86);
      color: #ffd86b;
      font-size: 11px;
      font-weight: 950;
      background: rgba(177, 9, 4, .32);
    }

    .fake-code {
      height: 25px;
      background:
        repeating-linear-gradient(90deg, #211d1c 0 2px, transparent 2px 4px, #211d1c 4px 7px, transparent 7px 10px),
        #fff;
      border: 1px solid #fff;
    }

    .progress {
      min-height: 20px;
      color: rgba(255, 255, 255, .9);
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    .settlement {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 14px;
      background: rgba(5, 13, 18, .72);
      backdrop-filter: blur(5px);
    }

    .settlement.show {
      display: grid;
    }

    .settlement-card {
      width: min(100%, 390px);
      padding: 16px;
      border: 1px solid rgba(255, 213, 79, .72);
      border-radius: 10px;
      color: white;
      background: linear-gradient(160deg, rgba(139, 12, 7, .96), rgba(36, 20, 19, .98));
      box-shadow: 0 28px 70px rgba(0, 0, 0, .45);
    }

    .settlement-card .score-card {
      min-height: 104px;
    }

    .mega-burst {
      position: fixed;
      z-index: 8;
      left: 50%;
      top: 45%;
      width: min(92vw, 380px);
      translate: -50% -50%;
      color: #fff06f;
      font-size: clamp(92px, 30vw, 150px);
      font-weight: 950;
      line-height: .9;
      text-align: center;
      pointer-events: none;
      -webkit-text-stroke: 3px #8f0f07;
      text-shadow:
        0 5px 0 #b71107,
        0 0 18px rgba(255, 239, 73, 1),
        0 0 42px rgba(255, 70, 13, .92),
        0 22px 34px rgba(0, 0, 0, .5);
    }

    .mega-burst::before,
    .mega-burst::after {
      content: "";
      position: absolute;
      inset: 50%;
      width: min(52vw, 220px);
      height: min(52vw, 220px);
      translate: -50% -50%;
      z-index: -1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 255, 255, .92) 0 8%, rgba(255, 232, 70, .92) 9% 23%, rgba(255, 65, 12, .72) 24% 42%, transparent 43%),
        conic-gradient(from 12deg, transparent 0 7deg, rgba(255, 224, 67, .95) 8deg 15deg, transparent 16deg 28deg);
      filter: blur(.2px);
      animation: burstFlash .48s ease-out forwards;
    }

    .mega-burst::after {
      width: min(70vw, 280px);
      height: min(70vw, 280px);
      opacity: .56;
      animation-duration: .62s;
      rotate: 17deg;
    }

    @keyframes burstFlash {
      from {
        opacity: 0;
        scale: .2;
      }
      28% {
        opacity: 1;
        scale: 1.08;
      }
      to {
        opacity: 0;
        scale: 1.45;
      }
    }

    .settlement-card h2 {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 22px;
      text-align: center;
    }

    .result-text {
      min-height: 24px;
      margin-top: 10px;
      color: #ffe898;
      font-size: 18px;
      font-weight: 950;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    @media (max-height: 760px) {
      .app {
        gap: 6px;
        padding-top: 7px;
      }

      .topbar {
        min-height: 48px;
      }

      .score-card {
        min-height: 66px;
      }

      .score {
        font-size: 22px;
      }

      .ticket {
        width: min(100%, 318px);
        min-height: 448px;
        padding: 9px 10px 11px;
      }

      .brand h1 {
        font-size: 38px;
      }

      .ticket-main {
        grid-template-columns: 66px 1fr;
      }

      .side-panel,
      .scratch-panel,
      .scratch-content {
        min-height: 162px;
      }

      .scratch-row {
        min-height: 20px;
      }

      .numbers-grid {
        gap: 3px;
      }

      .number-cell {
        min-height: 26px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div class="title">
        <strong>刮刮乐 Battle</strong>
        <span id="status">30 秒内尽量多刮，结束后再结算总分。</span>
      </div>
      <div class="timer" id="timer">30</div>
    </section>

    <section class="controls">
      <button class="primary-button" id="startButton" type="button">开始挑战</button>
      <button class="ghost-button" id="settleButton" type="button" disabled>查看结算</button>
    </section>

    <details class="webrtc-panel" id="webrtcPanel">
      <summary>WebRTC 邀请链接</summary>
      <div class="webrtc-body">
        <div class="webrtc-status" id="webrtcStatus">纯前端模式：邀请链接打开后，朋友还需要发回回应码。</div>
        <div class="webrtc-actions">
          <button class="ghost-button" id="createInviteButton" type="button">创建邀请</button>
          <button class="ghost-button" id="createAnswerButton" type="button" disabled>生成回应</button>
        </div>
        <textarea class="signal-box" id="inviteBox" readonly placeholder="邀请链接会出现在这里"></textarea>
        <textarea class="signal-box" id="answerBox" placeholder="朋友的回应码粘贴到这里"></textarea>
        <button class="primary-button" id="acceptAnswerButton" type="button">连接回应码</button>
      </div>
    </details>

    <section class="ticket-wrap">
      <article class="ticket" aria-label="好运来刮刮乐彩票">
        <header class="brand">
          <div class="brand-kicker">
            <span>中国福利彩票</span>
            <span>最高 10000</span>
          </div>
          <h1>好运来</h1>
        </header>

        <section class="ticket-main">
          <aside class="side-panel">
            <div class="notice">刮开银色覆盖膜，露出本张结果。</div>
            <div class="prize-callout">30S<br>Battle</div>
            <div class="notice">本局不显示总分，结束后统一结算。</div>
          </aside>

          <section class="scratch-panel" id="gameScratch" aria-label="图案刮奖区">
            <div class="scratch-content" id="gameRows"></div>
            <canvas class="scratch-layer" id="gameCanvas" aria-hidden="true"></canvas>
          </section>
        </section>

        <section class="numbers-panel" aria-label="号码刮奖区">
          <div class="numbers-head">
            <span>本张奖金</span>
            <span>我的号码</span>
            <span>中奖号</span>
            <strong class="winning-number" id="prizeText">¥0</strong>
            <span></span>
            <strong class="winning-number" id="winningNumber">--</strong>
          </div>
          <div class="numbers-grid" id="numbersGrid"></div>
        </section>

        <footer class="ticket-foot">
          <span id="serialNumber">J0000-00000-0000000</span>
          <div class="fake-code" aria-hidden="true"></div>
        </footer>
      </article>
    </section>

    <div class="progress" id="progressText">点开始后，按住银色区域拖动刮开。</div>
  </main>

  <section class="settlement" id="settlement" aria-hidden="true">
    <div class="settlement-card">
      <h2>结算中</h2>
      <section class="battle-scoreboard">
        <div class="score-card" id="settleRivalCard">
          <b>朋友</b>
          <div class="score" id="settleRivalScore">0</div>
          <div class="score-meta" id="settleRivalMeta">0 张</div>
        </div>
        <div class="score-card active" id="settlePlayerCard">
          <b>你</b>
          <div class="score" id="settlePlayerScore">0</div>
          <div class="score-meta" id="settlePlayerMeta">0 张</div>
        </div>
      </section>
      <div class="result-text" id="resultText">逐张开奖...</div>
      <button class="primary-button" id="againButton" type="button">再来一局</button>
    </div>
  </section>

  <script>
    const gameRows = document.querySelector("#gameRows");
    const numbersGrid = document.querySelector("#numbersGrid");
    const winningNumberEl = document.querySelector("#winningNumber");
    const prizeTextEl = document.querySelector("#prizeText");
    const serialNumberEl = document.querySelector("#serialNumber");
    const statusEl = document.querySelector("#status");
    const progressText = document.querySelector("#progressText");
    const timerEl = document.querySelector("#timer");
    const startButton = document.querySelector("#startButton");
    const settleButton = document.querySelector("#settleButton");
    const againButton = document.querySelector("#againButton");
    const webrtcPanel = document.querySelector("#webrtcPanel");
    const webrtcStatus = document.querySelector("#webrtcStatus");
    const createInviteButton = document.querySelector("#createInviteButton");
    const createAnswerButton = document.querySelector("#createAnswerButton");
    const acceptAnswerButton = document.querySelector("#acceptAnswerButton");
    const inviteBox = document.querySelector("#inviteBox");
    const answerBox = document.querySelector("#answerBox");
    const scratchPanel = document.querySelector("#gameScratch");
    const canvas = document.querySelector("#gameCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const settlement = document.querySelector("#settlement");
    const settlePlayerScore = document.querySelector("#settlePlayerScore");
    const settleRivalScore = document.querySelector("#settleRivalScore");
    const settlePlayerMeta = document.querySelector("#settlePlayerMeta");
    const settleRivalMeta = document.querySelector("#settleRivalMeta");
    const settlePlayerCard = document.querySelector("#settlePlayerCard");
    const settleRivalCard = document.querySelector("#settleRivalCard");
    const resultText = document.querySelector("#resultText");

    const symbols = ["✿", "❀", "✦", "☯", "✺", "✹", "☘", "✷", "❁", "✥", "✧", "✪"];
    const prizes = [
      { value: 0, weight: 760 },
      { value: 10, weight: 80 },
      { value: 20, weight: 55 },
      { value: 50, weight: 38 },
      { value: 100, weight: 24 },
      { value: 200, weight: 18 },
      { value: 500, weight: 12 },
      { value: 1000, weight: 7 },
      { value: 2000, weight: 4 },
      { value: 5000, weight: 1.5 },
      { value: 10000, weight: .5 }
    ];

    let ticket = null;
    let gameState = "idle";
    let isScratching = false;
    let currentTicketCounted = false;
    let secondsLeft = 30;
    let timerId = 0;
    let playerTickets = [];
    let rivalTickets = [];
    let playerTimes = [];
    let rivalTimes = [];
    let gameStartedAt = 0;
    let peerConnection = null;
    let dataChannel = null;
    let peerRole = "local";
    let suppressNetworkStart = false;

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function shuffle(list) {
      return [...list].sort(() => Math.random() - 0.5);
    }

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function moneyLabel(value) {
      return `¥${value.toLocaleString("zh-CN")}`;
    }

    function toSignal(data) {
      const json = JSON.stringify(data);
      const bytes = new TextEncoder().encode(json);
      let binary = "";
      bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function fromSignal(signal) {
      const normalized = signal.trim().replace(/^#/, "").replace(/^webrtc=/, "");
      const padded = normalized.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(normalized.length / 4) * 4, "=");
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function waitForIceGathering(pc) {
      if (pc.iceGatheringState === "complete") {
        return Promise.resolve();
      }

      return new Promise(resolve => {
        const timeout = setTimeout(resolve, 3000);
        pc.addEventListener("icegatheringstatechange", () => {
          if (pc.iceGatheringState === "complete") {
            clearTimeout(timeout);
            resolve();
          }
        });
      });
    }

    function setWebrtcStatus(message) {
      webrtcStatus.textContent = message;
    }

    function setupPeerConnection() {
      if (peerConnection) {
        peerConnection.close();
      }

      peerConnection = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });

      peerConnection.addEventListener("connectionstatechange", () => {
        setWebrtcStatus(`WebRTC 状态：${peerConnection.connectionState}`);
      });

      peerConnection.addEventListener("datachannel", event => {
        wireDataChannel(event.channel);
      });

      return peerConnection;
    }

    function wireDataChannel(channel) {
      dataChannel = channel;
      dataChannel.addEventListener("open", () => {
        setWebrtcStatus("WebRTC 已连接。房主点开始会同步到朋友。");
      });
      dataChannel.addEventListener("close", () => {
        setWebrtcStatus("WebRTC 已断开。");
      });
      dataChannel.addEventListener("message", event => {
        handlePeerMessage(JSON.parse(event.data));
      });
    }

    function sendPeerMessage(message) {
      if (dataChannel && dataChannel.readyState === "open") {
        dataChannel.send(JSON.stringify(message));
      }
    }

    function handlePeerMessage(message) {
      if (message.type === "start") {
        suppressNetworkStart = true;
        startGame();
        suppressNetworkStart = false;
        statusEl.textContent = "朋友发起了挑战，已同步开始。";
      }
    }

    async function createInvite() {
      peerRole = "host";
      const pc = setupPeerConnection();
      wireDataChannel(pc.createDataChannel("battle"));
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitForIceGathering(pc);
      const signal = toSignal({ type: "offer", sdp: pc.localDescription });
      const inviteUrl = `${location.origin}${location.pathname}#webrtc=${signal}`;
      inviteBox.value = inviteUrl;
      answerBox.value = "";
      setWebrtcStatus("邀请链接已生成。发给朋友，朋友打开后生成回应码发回你。");
    }

    async function createAnswer() {
      peerRole = "guest";
      const signal = location.hash.replace(/^#webrtc=/, "");
      if (!signal) {
        setWebrtcStatus("当前链接里没有邀请信息。");
        return;
      }

      const payload = fromSignal(signal);
      if (payload.type !== "offer") {
        setWebrtcStatus("邀请信息格式不对。");
        return;
      }

      const pc = setupPeerConnection();
      await pc.setRemoteDescription(payload.sdp);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitForIceGathering(pc);
      answerBox.value = toSignal({ type: "answer", sdp: pc.localDescription });
      setWebrtcStatus("回应码已生成。把下面这段发回房主。");
    }

    async function acceptAnswer() {
      if (!peerConnection || peerRole !== "host") {
        setWebrtcStatus("请先创建邀请，再粘贴朋友的回应码。");
        return;
      }

      const payload = fromSignal(answerBox.value);
      if (payload.type !== "answer") {
        setWebrtcStatus("回应码格式不对。");
        return;
      }

      await peerConnection.setRemoteDescription(payload.sdp);
      setWebrtcStatus("回应码已接收，正在建立 WebRTC 连接。");
    }

    function weightedPrize() {
      const total = prizes.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * total;
      for (const item of prizes) {
        roll -= item.weight;
        if (roll <= 0) {
          return item.value;
        }
      }
      return 0;
    }

    function makeSerial() {
      return `J${Math.floor(1000 + Math.random() * 9000)}-${Math.floor(10000 + Math.random() * 90000)}-${Math.floor(1000000 + Math.random() * 9000000)}`;
    }

    function createTicket() {
      const prizeAmount = weightedPrize();
      const winningNumber = Math.floor(1 + Math.random() * 49);
      const allNumbers = shuffle(Array.from({ length: 49 }, (_, index) => index + 1));
      const myNumbers = allNumbers.filter(number => number !== winningNumber).slice(0, 18);
      if (prizeAmount > 0) {
        myNumbers[Math.floor(Math.random() * myNumbers.length)] = winningNumber;
      }

      return {
        prizeAmount,
        winningNumber,
        displayedPrize: prizeAmount || pick([10, 20, 50, 100, 200]),
        numbers: myNumbers,
        serial: makeSerial(),
        rows: Array.from({ length: 7 }, (_, index) => {
          const rowSymbols = shuffle(symbols).slice(0, 3);
          if (prizeAmount > 0 && index === 0) {
            const same = pick(symbols);
            rowSymbols.splice(0, rowSymbols.length, same, same, same);
          }
          return {
            round: index + 1,
            symbols: rowSymbols,
            amount: index === 0 ? prizeAmount : pick([0, 10, 20, 50, 100, 200])
          };
        })
      };
    }

    function renderTicket() {
      winningNumberEl.textContent = pad2(ticket.winningNumber);
      prizeTextEl.textContent = moneyLabel(ticket.displayedPrize);
      serialNumberEl.textContent = ticket.serial;

      gameRows.innerHTML = ticket.rows.map(row => `
        <div class="scratch-row">
          <div class="round">第${row.round}局</div>
          <div class="symbols">${row.symbols.map(symbol => `<span>${symbol}</span>`).join("")}</div>
          <div class="amount">${moneyLabel(row.amount)}</div>
        </div>
      `).join("");

      numbersGrid.innerHTML = ticket.numbers.map(number => {
        const matched = ticket.prizeAmount > 0 && number === ticket.winningNumber ? " matched" : "";
        return `<div class="number-cell${matched}">${pad2(number)}</div>`;
      }).join("");
    }

    function resizeCanvas() {
      const rect = scratchPanel.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      paintCoating(rect.width, rect.height);
    }

    function paintCoating(width, height) {
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, "#eef0f0");
      gradient.addColorStop(.46, "#b7bbbe");
      gradient.addColorStop(.7, "#e6e7e6");
      gradient.addColorStop(1, "#a9adb1");

      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      ctx.globalAlpha = .22;

      for (let y = -height; y < height * 2; y += 8) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(width * .35, y + 20, width * .62, y - 20, width, y + 8);
        ctx.strokeStyle = "#8f4b86";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      ctx.globalAlpha = .2;
      for (let index = 0; index < 520; index += 1) {
        ctx.fillStyle = Math.random() > .5 ? "#ffffff" : "#6f7478";
        ctx.fillRect(Math.random() * width, Math.random() * height, 1, 1);
      }

      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(255,255,255,.44)";
      ctx.font = "900 16px Microsoft YaHei, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("按住刮开", width / 2, height / 2);
    }

    function scratchAt(clientX, clientY) {
      if (gameState !== "playing") {
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      ctx.globalCompositeOperation = "destination-out";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 30;
      ctx.beginPath();
      ctx.arc(x, y, 15, 0, Math.PI * 2);
      ctx.fill();
    }

    function getRevealedRatio() {
      const sample = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let transparent = 0;
      for (let index = 3; index < sample.length; index += 16) {
        if (sample[index] < 30) {
          transparent += 1;
        }
      }
      return transparent / (sample.length / 16);
    }

    function drawNewTicket() {
      ticket = createTicket();
      currentTicketCounted = false;
      renderTicket();
      resizeCanvas();
      progressText.textContent = `第 ${playerTickets.length + 1} 张，刮开超过 45% 自动进入下一张。`;
    }

    function maybeCompleteTicket() {
      if (gameState !== "playing" || currentTicketCounted) {
        return;
      }
      const ratio = getRevealedRatio();
      progressText.textContent = `已刮开 ${Math.round(ratio * 100)}%，超过 45% 算完成。`;

      if (ratio >= .45) {
        currentTicketCounted = true;
        playerTickets.push(ticket.prizeAmount);
        playerTimes.push((performance.now() - gameStartedAt) / 1000);
        progressText.textContent = `已完成 ${playerTickets.length} 张，继续下一张。`;
        setTimeout(() => {
          if (gameState === "playing") {
            drawNewTicket();
          }
        }, 180);
      }
    }

    function makeRivalTickets() {
      const target = Math.max(7, Math.min(18, playerTickets.length + Math.floor(Math.random() * 7) - 2));
      return Array.from({ length: target }, () => weightedPrize());
    }

    function makeRivalTimes(count) {
      return Array.from({ length: count }, () => 1.2 + Math.random() * 28.2).sort((a, b) => a - b);
    }

    function makeSettlementEvents() {
      const events = [
        ...playerTickets.map((amount, index) => ({
          side: "player",
          amount,
          time: playerTimes[index] ?? index + 1,
          ticketIndex: index + 1
        })),
        ...rivalTickets.map((amount, index) => ({
          side: "rival",
          amount,
          time: rivalTimes[index] ?? index + 1,
          ticketIndex: index + 1
        }))
      ];

      return events
        .filter(event => event.amount > 0)
        .sort((a, b) => a.time - b.time);
    }

    function startGame() {
      clearInterval(timerId);
      if (!suppressNetworkStart) {
        sendPeerMessage({ type: "start", at: Date.now() });
      }
      gameState = "playing";
      secondsLeft = 30;
      playerTickets = [];
      rivalTickets = [];
      playerTimes = [];
      rivalTimes = [];
      gameStartedAt = performance.now();
      timerEl.textContent = secondsLeft;
      statusEl.textContent = "比赛中：只统计张数，分数最后结算。";
      startButton.textContent = "重新开始";
      settleButton.disabled = true;
      settlement.classList.remove("show");
      settlement.setAttribute("aria-hidden", "true");
      drawNewTicket();

      timerId = setInterval(() => {
        secondsLeft -= 1;
        timerEl.textContent = secondsLeft;
        if (secondsLeft <= 0) {
          finishGame();
        }
      }, 1000);
    }

    function finishGame() {
      if (gameState !== "playing") {
        return;
      }
      clearInterval(timerId);
      gameState = "finished";
      timerEl.textContent = "0";
      rivalTickets = makeRivalTickets();
      rivalTimes = makeRivalTimes(rivalTickets.length);
      statusEl.textContent = "时间到。现在可以查看逐张结算动画。";
      progressText.textContent = `你完成 ${playerTickets.length} 张，朋友完成 ${rivalTickets.length} 张。`;
      settleButton.disabled = false;
    }

    function animateBurst(value, side) {
      const target = side === "player" ? settlePlayerScore : settleRivalScore;
      const targetRect = target.getBoundingClientRect();
      const endX = targetRect.left + targetRect.width / 2;
      const endY = targetRect.top + targetRect.height / 2;
      const startX = window.innerWidth / 2;
      const startY = window.innerHeight * .45;
      const el = document.createElement("div");
      el.className = "mega-burst";
      el.textContent = `+${value}`;
      el.style.left = `${startX}px`;
      el.style.top = `${startY}px`;
      settlement.append(el);

      const animation = el.animate([
        {
          left: `${startX}px`,
          top: `${startY}px`,
          opacity: 0,
          transform: "translate(-50%, -50%) scale(.35) rotate(-8deg)",
          offset: 0
        },
        {
          left: `${startX}px`,
          top: `${startY}px`,
          opacity: 1,
          transform: "translate(-50%, -50%) scale(1.16) rotate(3deg)",
          offset: .18
        },
        {
          left: `${startX}px`,
          top: `${startY}px`,
          opacity: 1,
          transform: "translate(-50%, -50%) scale(1) rotate(0deg)",
          offset: .48
        },
        {
          left: `${endX}px`,
          top: `${endY}px`,
          opacity: .96,
          transform: "translate(-50%, -50%) scale(.2) rotate(0deg)",
          offset: .86
        },
        {
          left: `${endX}px`,
          top: `${endY}px`,
          opacity: 0,
          transform: "translate(-50%, -50%) scale(.08) rotate(0deg)",
          offset: 1
        }
      ], {
        duration: 1250,
        easing: "cubic-bezier(.14,.94,.2,1)",
        fill: "forwards"
      });

      animation.finished.finally(() => el.remove());
      return animation.finished;
    }

    function roundDuration(index, total) {
      if (total <= 1) {
        return 1500;
      }
      const progress = index / (total - 1);
      const eased = 1 - Math.pow(1 - Math.min(progress, 1), 2.4);
      return Math.round(1500 - eased * 520);
    }

    async function runSettlement() {
      if (gameState === "playing") {
        finishGame();
      }
      if (gameState !== "finished") {
        return;
      }

      settlement.classList.add("show");
      settlement.setAttribute("aria-hidden", "false");
      settleButton.disabled = true;
      let playerTotal = 0;
      let rivalTotal = 0;
      const events = makeSettlementEvents();
      settlePlayerScore.textContent = "0";
      settleRivalScore.textContent = "0";
      settlePlayerMeta.textContent = `完成 ${playerTickets.length} 张`;
      settleRivalMeta.textContent = `完成 ${rivalTickets.length} 张`;

      if (events.length === 0) {
        resultText.textContent = "双方都没有刮出奖金";
        settleButton.disabled = false;
        return;
      }

      resultText.textContent = "按得分顺序开奖...";

      for (let index = 0; index < events.length; index += 1) {
        const event = events[index];
        const duration = roundDuration(index, events.length);
        const name = event.side === "player" ? "你" : "朋友";
        resultText.textContent = `${name} 第 ${event.ticketIndex} 张刮出 ${event.amount}`;
        await animateBurst(event.amount, event.side);

        if (event.side === "player") {
          playerTotal += event.amount;
          settlePlayerScore.textContent = playerTotal;
          settlePlayerMeta.textContent = `${index + 1} / ${events.length} 次得分`;
        } else {
          rivalTotal += event.amount;
          settleRivalScore.textContent = rivalTotal;
          settleRivalMeta.textContent = `${index + 1} / ${events.length} 次得分`;
        }

        await new Promise(resolve => setTimeout(resolve, Math.max(120, duration - 1250)));
      }

      settleButton.disabled = false;

      if (playerTotal > rivalTotal) {
        resultText.textContent = `你赢了：${playerTotal} : ${rivalTotal}`;
      } else if (playerTotal < rivalTotal) {
        resultText.textContent = `朋友赢了：${rivalTotal} : ${playerTotal}`;
      } else {
        resultText.textContent = `平局：${playerTotal} : ${rivalTotal}`;
      }
    }

    function beginScratch(event) {
      if (gameState !== "playing") {
        return;
      }
      isScratching = true;
      canvas.setPointerCapture(event.pointerId);
      scratchAt(event.clientX, event.clientY);
      maybeCompleteTicket();
    }

    function moveScratch(event) {
      if (!isScratching) {
        return;
      }
      scratchAt(event.clientX, event.clientY);
      maybeCompleteTicket();
    }

    function endScratch() {
      if (!isScratching) {
        return;
      }
      isScratching = false;
      maybeCompleteTicket();
    }

    canvas.addEventListener("pointerdown", beginScratch);
    canvas.addEventListener("pointermove", moveScratch);
    canvas.addEventListener("pointerup", endScratch);
    canvas.addEventListener("pointercancel", endScratch);
    canvas.addEventListener("pointerleave", endScratch);
    startButton.addEventListener("click", startGame);
    settleButton.addEventListener("click", runSettlement);
    againButton.addEventListener("click", startGame);
    createInviteButton.addEventListener("click", () => {
      createInvite().catch(error => setWebrtcStatus(`创建邀请失败：${error.message}`));
    });
    createAnswerButton.addEventListener("click", () => {
      createAnswer().catch(error => setWebrtcStatus(`生成回应失败：${error.message}`));
    });
    acceptAnswerButton.addEventListener("click", () => {
      acceptAnswer().catch(error => setWebrtcStatus(`连接回应失败：${error.message}`));
    });
    window.addEventListener("resize", () => {
      if (ticket) {
        resizeCanvas();
      }
    });

    if (location.hash.startsWith("#webrtc=")) {
      webrtcPanel.open = true;
      createAnswerButton.disabled = false;
      inviteBox.value = location.href;
      setWebrtcStatus("检测到邀请链接。点“生成回应”，再把回应码发回房主。");
    }

    ticket = createTicket();
    renderTicket();
    resizeCanvas();
  </script>
</body>
</html>

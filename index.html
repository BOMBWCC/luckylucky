<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>好运来刮刮乐</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ticket-red: #e91612;
      --ticket-deep: #b80705;
      --gold: #ffd04a;
      --gold-dark: #f2a900;
      --paper: #f4f0e7;
      --ink: #34302d;
      --silver: #cfd1d3;
      --shadow: rgba(60, 15, 0, .32);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 14px;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 226, 93, .28), transparent 24%),
        radial-gradient(circle at 82% 14%, rgba(75, 173, 255, .24), transparent 26%),
        linear-gradient(135deg, #14222e 0%, #25505b 44%, #17272c 100%);
    }

    .app {
      width: min(100%, 430px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: white;
    }

    .status {
      min-width: 0;
      font-size: 14px;
      line-height: 1.35;
      opacity: .94;
    }

    .reset-button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      color: #7b1209;
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(180deg, #fff4b7, #ffc832);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255, 255, 255, .7);
      cursor: pointer;
    }

    .reset-button:active {
      transform: translateY(1px);
    }

    .ticket {
      position: relative;
      overflow: hidden;
      min-height: 740px;
      padding: 16px 17px 20px;
      border: 5px solid #ffcc45;
      border-radius: 9px;
      background:
        radial-gradient(circle at 16px 16px, rgba(255, 216, 72, .34) 0 2px, transparent 3px) 0 0 / 31px 31px,
        radial-gradient(circle at 100% 10%, rgba(255, 227, 91, .34), transparent 28%),
        linear-gradient(160deg, #ff2a15, #d80c08 48%, #fa2f13);
      box-shadow: 0 24px 55px var(--shadow);
    }

    .ticket::before,
    .ticket::after {
      content: "";
      position: absolute;
      inset: 10px;
      pointer-events: none;
      border: 2px solid rgba(255, 207, 74, .85);
      border-radius: 6px;
    }

    .ticket::after {
      inset: 20px;
      border-style: dashed;
      opacity: .5;
    }

    .brand {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #ffe65e;
      text-shadow: 0 4px 0 rgba(138, 0, 0, .45), 0 0 14px rgba(255, 238, 111, .42);
    }

    .brand-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 800;
      color: #ffd665;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(46px, 14vw, 72px);
      line-height: .92;
      letter-spacing: 0;
      font-family: "STXingkai", "KaiTi", "Microsoft YaHei", cursive;
    }

    .main-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .side-panel,
    .scratch-panel,
    .bonus-panel,
    .numbers-panel,
    .barcode {
      border: 2px solid rgba(255, 205, 65, .9);
      background: rgba(198, 12, 5, .28);
    }

    .side-panel {
      min-height: 306px;
      padding: 10px 8px;
      display: grid;
      align-content: start;
      gap: 10px;
      color: #ffe47e;
      font-weight: 800;
    }

    .notice {
      padding: 7px;
      border-radius: 6px;
      color: #b30b04;
      font-size: 11px;
      line-height: 1.35;
      background: #ffcc3a;
    }

    .prize-callout {
      display: grid;
      place-items: center;
      min-height: 134px;
      border: 2px solid #ffcf4d;
      color: #ffdb48;
      font-size: 30px;
      line-height: 1.06;
      text-align: center;
      background: rgba(255, 65, 12, .42);
    }

    .scratch-panel {
      position: relative;
      overflow: hidden;
      min-height: 306px;
      background: var(--paper);
      box-shadow: inset 0 0 0 2px rgba(136, 0, 0, .2);
      touch-action: none;
      user-select: none;
    }

    .scratch-content {
      min-height: 306px;
      padding: 10px 9px;
      background:
        repeating-linear-gradient(112deg, rgba(171, 37, 103, .12) 0 2px, transparent 2px 9px),
        linear-gradient(#f6f2e9, #e8e2d7);
    }

    .scratch-row {
      display: grid;
      grid-template-columns: 24px 1fr 74px;
      align-items: center;
      min-height: 28px;
      border-bottom: 1px dashed rgba(70, 47, 41, .28);
      font-size: 12px;
    }

    .round {
      color: #6b5752;
      writing-mode: vertical-rl;
      font-weight: 900;
    }

    .symbols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      justify-items: center;
      font-size: 22px;
      filter: grayscale(1);
    }

    .amount {
      justify-self: end;
      font-weight: 950;
      font-size: 16px;
      color: #2f2b29;
    }

    .amount span {
      display: block;
      font-size: 9px;
      font-weight: 800;
      color: #65524d;
      text-align: right;
    }

    .scratch-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .bonus-panel {
      position: relative;
      z-index: 1;
      width: 140px;
      margin: 10px 0 0 6px;
      background: var(--paper);
    }

    .bonus-content {
      height: 108px;
      display: grid;
      place-items: center;
      font-size: 44px;
      font-family: "STXingkai", "KaiTi", serif;
      font-weight: 900;
      color: #3e3330;
      background: repeating-linear-gradient(108deg, rgba(167, 31, 97, .14) 0 2px, transparent 2px 9px);
    }

    .numbers-panel {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      overflow: hidden;
      background: var(--paper);
    }

    .numbers-head {
      display: grid;
      grid-template-columns: 110px 1fr 58px;
      gap: 8px;
      align-items: end;
      padding: 8px 9px 3px;
      color: #9d160d;
      font-size: 12px;
      font-weight: 900;
      background: linear-gradient(180deg, rgba(255, 218, 72, .72), rgba(255, 218, 72, .2));
    }

    .winning-number {
      text-align: center;
      font-size: 26px;
      line-height: 1;
      color: #302b29;
      text-shadow: 1px 1px 0 white;
    }

    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 9px 10px;
      gap: 6px;
      background:
        repeating-linear-gradient(110deg, rgba(173, 42, 109, .13) 0 2px, transparent 2px 9px),
        #eee8dd;
    }

    .number-cell {
      min-height: 42px;
      display: grid;
      place-items: center;
      border-bottom: 1px dashed rgba(67, 49, 44, .3);
      color: #342f2d;
      font-size: 23px;
      font-weight: 950;
      text-shadow: 1px 1px 0 #fff;
    }

    .number-cell small {
      margin-top: -5px;
      display: block;
      font-size: 8px;
      font-weight: 800;
      color: #5f514e;
      text-align: center;
      text-shadow: none;
    }

    .matched {
      color: #b90f08;
      outline: 2px solid rgba(185, 15, 8, .5);
      background: rgba(255, 218, 72, .42);
      border-radius: 3px;
    }

    .barcode {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      min-height: 50px;
      display: grid;
      grid-template-columns: 1fr 158px;
      gap: 14px;
      align-items: end;
      padding: 8px 10px;
      color: #ffd665;
      font-weight: 900;
    }

    .fake-code {
      height: 35px;
      background:
        repeating-linear-gradient(90deg, #211d1c 0 2px, transparent 2px 4px, #211d1c 4px 7px, transparent 7px 10px),
        #fff;
      border: 2px solid #fff;
    }

    .serial {
      grid-column: 2;
      color: #2f2b29;
      font-size: 12px;
      text-align: center;
      background: #f5eee1;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      translate: -50% 18px;
      max-width: min(92vw, 360px);
      padding: 11px 16px;
      border-radius: 999px;
      color: #681007;
      font-size: 14px;
      font-weight: 900;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      background: #ffe889;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .26);
      transition: opacity .2s ease, translate .2s ease;
    }

    .toast.show {
      opacity: 1;
      translate: -50% 0;
    }

    @media (max-width: 390px) {
      body {
        padding-inline: 8px;
      }

      .ticket {
        padding: 13px 12px 18px;
        min-height: 708px;
      }

      .main-grid {
        grid-template-columns: 94px 1fr;
      }

      .prize-callout {
        font-size: 25px;
      }

      .scratch-row {
        grid-template-columns: 21px 1fr 62px;
      }

      .symbols {
        font-size: 19px;
      }

      .amount {
        font-size: 14px;
      }

      .numbers-grid {
        gap: 4px;
      }

      .number-cell {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="toolbar">
      <div class="status" id="status">按住鼠标在银色区域拖动，刮开涂层。</div>
      <button class="reset-button" id="resetButton" type="button">重置</button>
    </div>

    <article class="ticket" aria-label="好运来刮刮乐彩票">
      <header class="brand">
        <div class="brand-kicker">
          <span>中国福利彩票</span>
          <span>面值 30 元</span>
        </div>
        <h1>好运来</h1>
      </header>

      <section class="main-grid">
        <aside class="side-panel">
          <div class="notice">本票共有 10 局玩法，刮开银色覆盖膜即可查看结果。</div>
          <div class="prize-callout">最高<br>奖金<br>80 万元</div>
          <div class="notice">刮出相同图案或号码命中，即获得对应奖金。</div>
        </aside>

        <section class="scratch-panel" id="gameScratch" aria-label="图案刮奖区">
          <div class="scratch-content" id="gameRows"></div>
          <canvas class="scratch-layer" id="gameCanvas" aria-hidden="true"></canvas>
        </section>
      </section>

      <section class="bonus-panel" aria-label="财富字样">
        <div class="bonus-content" id="fortuneWord">富</div>
      </section>

      <section class="numbers-panel" aria-label="号码刮奖区">
        <div class="numbers-head">
          <span>奖金 ▼</span>
          <span>我的号码 ▼</span>
          <span>中奖号码 ▲</span>
          <strong class="winning-number" id="prizeText">¥80</strong>
          <span></span>
          <strong class="winning-number" id="winningNumber">35</strong>
        </div>
        <div class="numbers-grid" id="numbersGrid"></div>
      </section>

      <footer class="barcode">
        <span>保安区 刮开无效</span>
        <div class="fake-code" aria-hidden="true"></div>
        <span class="serial" id="serialNumber">J0826-25062-0233662-119-2</span>
      </footer>
    </article>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const gameRows = document.querySelector("#gameRows");
    const numbersGrid = document.querySelector("#numbersGrid");
    const winningNumberEl = document.querySelector("#winningNumber");
    const prizeTextEl = document.querySelector("#prizeText");
    const fortuneWordEl = document.querySelector("#fortuneWord");
    const serialNumberEl = document.querySelector("#serialNumber");
    const statusEl = document.querySelector("#status");
    const resetButton = document.querySelector("#resetButton");
    const scratchPanel = document.querySelector("#gameScratch");
    const canvas = document.querySelector("#gameCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const toast = document.querySelector("#toast");

    const symbols = ["✿", "❀", "✦", "☯", "✺", "✹", "☘", "✷", "❁", "✥", "✧", "✪"];
    const money = [40, 60, 80, 100, 500, 1000, 5000, 100000, 800000];
    const words = ["富", "财", "福", "喜", "吉", "禄"];
    let ticket = null;
    let isScratching = false;
    let revealedMessageShown = false;
    let toastTimer = 0;

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function shuffle(list) {
      return [...list].sort(() => Math.random() - 0.5);
    }

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function moneyLabel(value) {
      return value >= 10000 ? `¥${value.toLocaleString("zh-CN")}` : `¥${value}`;
    }

    function makeSerial() {
      const parts = [
        Math.floor(1000 + Math.random() * 9000),
        Math.floor(10000 + Math.random() * 90000),
        Math.floor(1000000 + Math.random() * 9000000),
        Math.floor(100 + Math.random() * 900),
        Math.floor(1 + Math.random() * 9)
      ];
      return `J${parts[0]}-${parts[1]}-${parts[2]}-${parts[3]}-${parts[4]}`;
    }

    function createTicket() {
      const winningNumber = Math.floor(1 + Math.random() * 49);
      const shouldWin = Math.random() > 0.42;
      const amount = pick(money);
      const allNumbers = shuffle(Array.from({ length: 49 }, (_, index) => index + 1));
      const myNumbers = allNumbers.filter(number => number !== winningNumber).slice(0, 24);
      const winIndex = Math.floor(Math.random() * myNumbers.length);

      if (shouldWin) {
        myNumbers[winIndex] = winningNumber;
      }

      return {
        winningNumber,
        prizeAmount: shouldWin ? amount : 0,
        displayedPrize: amount,
        numbers: myNumbers,
        fortuneWord: pick(words),
        serial: makeSerial(),
        rows: Array.from({ length: 10 }, (_, index) => {
          const rowSymbols = shuffle(symbols).slice(0, 3);
          const rowWins = Math.random() > 0.72;
          if (rowWins) {
            const same = pick(symbols);
            rowSymbols.splice(0, rowSymbols.length, same, same, same);
          }
          return {
            round: index + 1,
            symbols: rowSymbols,
            amount: rowWins ? pick(money) : pick(money.slice(0, 6))
          };
        })
      };
    }

    function renderTicket() {
      winningNumberEl.textContent = pad2(ticket.winningNumber);
      prizeTextEl.textContent = moneyLabel(ticket.displayedPrize);
      fortuneWordEl.textContent = ticket.fortuneWord;
      serialNumberEl.textContent = ticket.serial;

      gameRows.innerHTML = ticket.rows.map(row => `
        <div class="scratch-row">
          <div class="round">第${row.round}局</div>
          <div class="symbols">${row.symbols.map(symbol => `<span>${symbol}</span>`).join("")}</div>
          <div class="amount">${moneyLabel(row.amount)}<span>${row.amount}</span></div>
        </div>
      `).join("");

      numbersGrid.innerHTML = ticket.numbers.map(number => {
        const matched = number === ticket.winningNumber ? " matched" : "";
        return `<div class="number-cell${matched}">${pad2(number)}<small>${number}</small></div>`;
      }).join("");
    }

    function resizeCanvas() {
      const rect = scratchPanel.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * ratio);
      canvas.height = Math.round(rect.height * ratio);
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      paintCoating(rect.width, rect.height);
    }

    function paintCoating(width, height) {
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, "#eef0f0");
      gradient.addColorStop(.42, "#b9bdc0");
      gradient.addColorStop(.68, "#e6e7e6");
      gradient.addColorStop(1, "#a9adb1");

      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      ctx.globalAlpha = .24;

      for (let y = -height; y < height * 2; y += 9) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(width * .35, y + 24, width * .62, y - 24, width, y + 8);
        ctx.strokeStyle = "#8f4b86";
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      ctx.globalAlpha = .18;
      for (let index = 0; index < 900; index += 1) {
        ctx.fillStyle = Math.random() > .5 ? "#ffffff" : "#6f7478";
        ctx.fillRect(Math.random() * width, Math.random() * height, 1, 1);
      }

      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(255,255,255,.38)";
      ctx.font = "900 20px Microsoft YaHei, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("按住鼠标刮开", width / 2, height / 2);
    }

    function scratchAt(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.arc(x, y, 17, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 34;
      ctx.beginPath();
      ctx.moveTo(x - 1, y - 1);
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function getRevealedRatio() {
      const sample = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let transparent = 0;
      for (let index = 3; index < sample.length; index += 16) {
        if (sample[index] < 30) {
          transparent += 1;
        }
      }
      return transparent / (sample.length / 16);
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
    }

    function updateRevealStatus() {
      const ratio = getRevealedRatio();
      statusEl.textContent = `已刮开 ${Math.round(ratio * 100)}%。继续刮开查看更多内容。`;

      if (!revealedMessageShown && ratio > .56) {
        revealedMessageShown = true;
        const message = ticket.prizeAmount > 0
          ? `恭喜，号码命中，奖金 ${moneyLabel(ticket.prizeAmount)}！`
          : "这张没有命中，重置再试一张。";
        showToast(message);
        statusEl.textContent = message;
      }
    }

    function beginScratch(event) {
      isScratching = true;
      canvas.setPointerCapture(event.pointerId);
      scratchAt(event.clientX, event.clientY);
      updateRevealStatus();
    }

    function moveScratch(event) {
      if (!isScratching) {
        return;
      }
      scratchAt(event.clientX, event.clientY);
    }

    function endScratch() {
      if (!isScratching) {
        return;
      }
      isScratching = false;
      updateRevealStatus();
    }

    function resetGame() {
      ticket = createTicket();
      revealedMessageShown = false;
      renderTicket();
      resizeCanvas();
      statusEl.textContent = "按住鼠标在银色区域拖动，刮开涂层。";
      showToast("新票已生成。");
    }

    canvas.addEventListener("pointerdown", beginScratch);
    canvas.addEventListener("pointermove", moveScratch);
    canvas.addEventListener("pointerup", endScratch);
    canvas.addEventListener("pointercancel", endScratch);
    canvas.addEventListener("pointerleave", endScratch);
    resetButton.addEventListener("click", resetGame);
    window.addEventListener("resize", () => {
      if (ticket) {
        resizeCanvas();
      }
    });

    resetGame();
  </script>
</body>
</html>
